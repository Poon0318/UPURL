services:
  - type: web
    name: upurl-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_PATH
        value: /tmp/monitor.db
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://idyllic-speculoos-ddc1b8.netlify.app
      - key: CHECK_INTERVAL_SECONDS
        value: "60"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "12"
      - key: MAX_CONCURRENT_CHECKS
        value: "20"
